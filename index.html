<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beans</title>
    <link
      rel="shortcut icon"
      href="./images/icons/favicon.ico"
      type="image/x-icon"
    />

    <!-- ПЕРЕДЗАВАНТАЖЕННЯ КАРТИНОК -->
    <!-- <link rel="preload" as="image" href="" media="(max-width: 766px)" />
    <link rel="preload" as="image" href="" media="(min-width: 767px)" /> -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Clicker+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/css/styles.min.css" />
  </head>
  <body class="page right-fix-padding">
    <div class="wrapper">
      <header class="header">
        <div class="header__container">
          <div class="header__content">
            <a href="index.html" class="logo header__logo">
              <img
                src=""
                alt="cookie-logo"
                width="180"
                height="52"
                loading="lazy"
                decoding="async"
              />
            </a>
            <div class="header__menu menu">
              <nav class="menu__body">
                <ul class="menu__list">
                  <li class="menu__item">
                    <a
                      href="#cookies"
                      class="menu__link link"
                      data-goto="#cookies"
                      ><span>Cookies</span></a
                    >
                  </li>
                  <li class="menu__item">
                    <a
                      href="index.html#locations"
                      class="menu__link link"
                      data-goto="#locations"
                      ><span>Locations</span></a
                    >
                  </li>
                  <li class="menu__item">
                    <a href="about.html" class="menu__link link"
                      ><span>About</span></a
                    >
                  </li>
                </ul>
              </nav>
            </div>
            <button class="burger translate-center"><span></span></button>
          </div>
        </div>
      </header>

      <main class="main">
        <section class="main__section hero">
          <div class="hero__container">
            <div class="hero__content">
              <button class="button waves">
                <span>Explore more</span>
                <div class="waves__blobs">
                  <span></span>
                  <span></span>
                  <span></span>
                  <span></span>
                </div>
              </button>
              <a href="#" class="link neon-underline"
                ><span>Explore more</span>
              </a>
            </div>
          </div>
        </section>
        <section class="subscribe">
          <div class="subscribe__container">
            <form
              action="/submit"
              method="post"
              id="registrationForm"
              name="registrationForm"
              enctype="multipart/form-data"
              autocomplete="on"
              accept-charset="UTF-8"
              novalidate
              class="form"
            >
              <div class="form__elem">
                <label for="email">Email *</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="example@mail.com"
                  required
                  autocomplete="email"
                  inputmode="email"
                />
              </div>
              <div class="form__elem">
                <button type="submit" class="form__submit">Subscribe</button>
              </div>
            </form>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="footer__container">
          <div class="footer__content"></div>
        </div>
      </footer>
    </div>
    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
